<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>TRA LIVE｜台鐵即時列車地圖</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      background: #070a0e;
      color: #eef3f8;
    }

    body {
      display: flex;
    }

    /* =========================
       APP
    ========================= */

    #app {
      width: 100%;
      height: 100%;

      display: grid;
      grid-template-columns: 340px 1fr;
    }


    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      height: 100%;

      background:
        linear-gradient(
          180deg,
          #0d1218 0%,
          #090d12 100%
        );

      border-right: 1px solid #202934;

      display: flex;
      flex-direction: column;

      z-index: 2000;
    }


    /* =========================
       HEADER
    ========================= */

    .brand {
      height: 74px;

      padding: 14px 17px;

      display: flex;
      align-items: center;
      gap: 12px;

      border-bottom: 1px solid #202934;
    }

    .brand-logo {
      width: 43px;
      height: 43px;

      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #141b23;
      border: 1px solid #293541;

      font-size: 22px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .brand-subtitle {
      margin-top: 3px;

      font-size: 11px;

      color: #7f8b99;
    }


    /* =========================
       SEARCH
    ========================= */

    .search-box {
      padding: 13px;

      border-bottom: 1px solid #202934;
    }

    #search {
      width: 100%;
      height: 42px;

      padding: 0 13px;

      color: white;

      background: #080c11;

      border: 1px solid #283440;
      border-radius: 9px;

      outline: none;

      font-size: 13px;
    }

    #search:focus {
      border-color: #4b657b;
    }


    /* =========================
       STATISTICS
    ========================= */

    .statistics {
      padding: 12px;

      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 8px;
    }

    .stat-card {
      padding: 11px;

      background: #0e141b;

      border: 1px solid #202a35;

      border-radius: 9px;
    }

    .stat-label {
      font-size: 10px;

      color: #768392;

      letter-spacing: .6px;
    }

    .stat-value {
      margin-top: 5px;

      font-size: 20px;
      font-weight: 750;
    }


    /* =========================
       CONTENT
    ========================= */

    .sidebar-content {
      flex: 1;

      overflow-y: auto;

      padding: 0 13px 20px;
    }

    .section-title {
      margin: 10px 2px 8px;

      font-size: 10px;

      color: #71808f;

      letter-spacing: 1.3px;

      text-transform: uppercase;
    }


    /* =========================
       CONNECTION
    ========================= */

    .connection {
      padding: 10px 11px;

      display: flex;
      align-items: center;
      gap: 9px;

      background: #0e141b;

      border: 1px solid #202a35;

      border-radius: 9px;

      font-size: 12px;
    }

    .connection-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #36e39a;

      box-shadow:
        0 0 10px rgba(54, 227, 154, .65);
    }

    .connection-dot.error {
      background: #ff5969;

      box-shadow:
        0 0 10px rgba(255, 89, 105, .65);
    }

    .update-time {
      margin-top: 8px;

      font-size: 10px;

      color: #657280;
    }


    /* =========================
       ALERT
    ========================= */

    .alert-card {
      padding: 11px;

      margin-bottom: 8px;

      background:
        linear-gradient(
          135deg,
          #1b1115,
          #120e12
        );

      border: 1px solid #45242b;

      border-radius: 9px;
    }

    .alert-title {
      color: #ff7d89;

      font-size: 12px;
      font-weight: 700;
    }

    .alert-description {
      margin-top: 5px;

      color: #b9c2cb;

      font-size: 11px;

      line-height: 1.5;
    }

    .no-alert {
      padding: 10px;

      color: #36e39a;

      font-size: 11px;

      background: #0d1815;

      border: 1px solid #19382e;

      border-radius: 9px;
    }


    /* =========================
       MAP
    ========================= */

    .map-container {
      position: relative;

      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;

      background: #11161c;
    }


    /* =========================
       TOP BAR
    ========================= */

    .top-bar {
      position: absolute;

      top: 14px;
      left: 14px;
      right: 14px;

      z-index: 1200;

      display: flex;
      align-items: center;
      justify-content: space-between;

      pointer-events: none;
    }

    .top-pill {
      pointer-events: auto;

      padding: 9px 12px;

      background: rgba(8, 12, 17, .92);

      border: 1px solid #27323d;

      border-radius: 9px;

      backdrop-filter: blur(12px);

      font-size: 12px;

      box-shadow:
        0 8px 25px rgba(0,0,0,.3);
    }

    .live {
      color: #36e39a;

      font-weight: 800;
    }


    /* =========================
       TRAIN MARKER
    ========================= */

    .train-marker {
      width: 15px;
      height: 15px;

      border-radius: 50%;

      background: #f4f8fb;

      border: 3px solid #36e39a;

      box-shadow:
        0 0 0 3px rgba(54,227,154,.13),
        0 0 15px rgba(54,227,154,.75);
    }


    /* =========================
       STATION MARKER
    ========================= */

    .station-marker {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #aeb8c2;

      border: 2px solid #12171d;
    }


    /* =========================
       POPUP
    ========================= */

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #0e141b;

      color: #eef3f8;

      border: 1px solid #293541;
    }

    .leaflet-popup-content {
      margin: 13px;

      min-width: 200px;
    }

    .popup-title {
      font-size: 16px;

      font-weight: 800;
    }

    .popup-subtitle {
      margin-top: 2px;

      color: #7f8c9b;

      font-size: 11px;
    }

    .popup-row {
      display: flex;

      justify-content: space-between;

      gap: 15px;

      padding: 7px 0;

      border-bottom: 1px solid #202a35;

      font-size: 11px;
    }

    .popup-row:last-child {
      border-bottom: none;
    }

    .good {
      color: #36e39a;
    }

    .late {
      color: #ff6674;
    }


    /* =========================
       SEARCH RESULTS
    ========================= */

    .search-results {
      position: absolute;

      top: 66px;
      left: 14px;

      width: min(390px, calc(100% - 28px));

      z-index: 1300;

      display: none;

      background: rgba(9, 13, 18, .97);

      border: 1px solid #293541;

      border-radius: 10px;

      overflow: hidden;

      box-shadow:
        0 15px 45px rgba(0,0,0,.45);
    }

    .search-results.show {
      display: block;
    }

    .search-result {
      width: 100%;

      padding: 11px 13px;

      color: #eef3f8;

      background: transparent;

      border: 0;

      border-bottom: 1px solid #202a35;

      text-align: left;

      cursor: pointer;
    }

    .search-result:hover {
      background: #151d26;
    }

    .result-type {
      margin-right: 5px;
    }

    .result-name {
      font-weight: 700;
    }

    .result-detail {
      margin-left: 7px;

      color: #778594;

      font-size: 10px;
    }


    /* =========================
       LEGEND
    ========================= */

    .legend {
      position: absolute;

      right: 16px;
      bottom: 17px;

      z-index: 1100;

      padding: 10px 12px;

      background: rgba(8, 12, 17, .92);

      border: 1px solid #27323d;

      border-radius: 9px;

      font-size: 10px;

      color: #aab5bf;
    }

    .legend-item {
      display: flex;

      align-items: center;

      gap: 7px;

      margin: 5px 0;
    }


    /* =========================
       MOBILE
    ========================= */

    .mobile-menu {
      display: none;

      position: absolute;

      top: 13px;
      left: 13px;

      z-index: 1500;

      width: 40px;
      height: 40px;

      border-radius: 10px;

      background: #0d1218;

      border: 1px solid #293541;

      color: white;

      font-size: 19px;
    }

    @media (max-width: 800px) {

      #app {
        display: block;
      }

      .sidebar {
        position: absolute;

        top: 10px;
        bottom: 10px;
        left: 10px;

        width: min(315px, calc(100% - 20px));

        border: 1px solid #27323d;

        border-radius: 14px;

        transform:
          translateX(calc(-100% - 20px));

        transition: transform .22s ease;

        box-shadow:
          0 20px 60px rgba(0,0,0,.6);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-menu {
        display: block;
      }

      .top-bar {
        left: 62px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-logo">🚆</div>

      <div>
        <div class="brand-title">
          TRA LIVE
        </div>

        <div class="brand-subtitle">
          台鐵即時列車地圖
        </div>
      </div>
    </div>


    <div class="search-box">
      <input
        id="search"
        type="text"
        autocomplete="off"
        placeholder="搜尋車次或車站，例如 327、臺北"
      >
    </div>


    <div class="statistics">

      <div class="stat-card">
        <div class="stat-label">
          LIVE TRAINS
        </div>

        <div
          class="stat-value"
          id="trainCount"
        >
          --
        </div>
      </div>


      <div class="stat-card">
        <div class="stat-label">
          STATIONS
        </div>

        <div
          class="stat-value"
          id="stationCount"
        >
          --
        </div>
      </div>

    </div>


    <div class="sidebar-content">

      <div class="section-title">
        SYSTEM
      </div>

      <div class="connection">

        <span
          class="connection-dot"
          id="connectionDot"
        ></span>

        <span id="connectionText">
          TDX API 連線中
        </span>

      </div>

      <div
        class="update-time"
        id="updateTime"
      >
        等待資料…
      </div>


      <div class="section-title">
        ALERTS
      </div>

      <div id="alerts">
        <div class="no-alert">
          讀取中…
        </div>
      </div>

    </div>

  </aside>


  <main class="map-container">

    <button
      class="mobile-menu"
      id="mobileMenu"
    >
      ☰
    </button>


    <div class="top-bar">

      <div class="top-pill">
        🚆 <strong>TRA LIVE</strong>
      </div>

      <div class="top-pill">
        <span class="live">● LIVE</span>
        &nbsp; 30 SEC
      </div>

    </div>


    <div
      class="search-results"
      id="searchResults"
    ></div>


    <div id="map"></div>


    <div class="legend">

      <div class="legend-item">
        <span class="train-marker"></span>
        即時列車
      </div>

      <div class="legend-item">
        <span class="station-marker"></span>
        車站
      </div>

    </div>

  </main>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="/app.js"></script>

</body>
</html>
