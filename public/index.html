<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TRA Live Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071016;
      color: #eef5f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      position: relative;
    }

    /* =========================
       SIDEBAR
    ========================= */

    #sidebar {
      width: 355px;
      height: 100%;
      background:
        linear-gradient(
          180deg,
          #0b171d 0%,
          #081217 55%,
          #061015 100%
        );
      border-right: 1px solid rgba(255,255,255,.08);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      box-shadow: 12px 0 40px rgba(0,0,0,.28);
    }

    .brand {
      height: 82px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .brand-logo {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: linear-gradient(145deg,#e9f4f7,#8eaab2);
      color: #081116;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 7px 25px rgba(0,0,0,.3);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 850;
      letter-spacing: .4px;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: #76909a;
      font-size: 11px;
      letter-spacing: 1.2px;
    }

    .live-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #8ea8af;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #55e58b;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(85,229,139,.7);
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      padding: 16px 18px 10px;
    }

    .search-wrapper {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #708891;
      font-size: 16px;
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      height: 45px;
      border: 1px solid rgba(255,255,255,.08);
      outline: none;
      border-radius: 13px;
      padding: 0 14px 0 40px;
      background: rgba(255,255,255,.045);
      color: white;
      font-size: 13px;
      transition: .2s;
    }

    #searchInput:focus {
      border-color: rgba(148,190,201,.55);
      background: rgba(255,255,255,.065);
    }

    #searchInput::placeholder {
      color: #60747c;
    }

    /* =========================
       QUICK FILTER
    ========================= */

    .filters {
      padding: 6px 18px 14px;
      display: flex;
      gap: 7px;
    }

    .filter-btn {
      flex: 1;
      border: 1px solid rgba(255,255,255,.07);
      background: rgba(255,255,255,.035);
      color: #789099;
      border-radius: 10px;
      height: 34px;
      font-size: 11px;
      cursor: pointer;
      transition: .2s;
    }

    .filter-btn:hover {
      background: rgba(255,255,255,.07);
      color: white;
    }

    .filter-btn.active {
      background: rgba(207,225,230,.12);
      color: #edf7f9;
      border-color: rgba(207,225,230,.22);
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
      padding: 0 18px 15px;
    }

    .stat {
      padding: 12px 10px;
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.025);
      border-radius: 12px;
    }

    .stat-value {
      font-size: 19px;
      font-weight: 850;
      line-height: 1;
    }

    .stat-label {
      margin-top: 7px;
      font-size: 9px;
      color: #657c84;
      letter-spacing: .8px;
    }

    /* =========================
       TRAIN LIST
    ========================= */

    .section-title {
      padding: 0 20px 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title strong {
      font-size: 11px;
      letter-spacing: 1.1px;
      color: #b7cbd0;
    }

    .section-title span {
      font-size: 9px;
      color: #60757d;
    }

    #trainList {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 18px;
    }

    #trainList::-webkit-scrollbar {
      width: 4px;
    }

    #trainList::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.1);
      border-radius: 10px;
    }

    .train-item {
      position: relative;
      margin: 5px 0;
      padding: 13px 13px;
      border-radius: 13px;
      border: 1px solid transparent;
      background: rgba(255,255,255,.025);
      cursor: pointer;
      transition: .18s;
    }

    .train-item:hover {
      background: rgba(255,255,255,.055);
      border-color: rgba(255,255,255,.07);
      transform: translateX(2px);
    }

    .train-item.selected {
      background: rgba(205,224,230,.09);
      border-color: rgba(205,224,230,.18);
    }

    .train-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .train-number {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .3px;
    }

    .train-type {
      margin-left: 7px;
      font-size: 10px;
      color: #8299a1;
    }

    .delay {
      font-size: 11px;
      font-weight: 800;
      color: #7ee6a1;
    }

    .delay.late {
      color: #ffbd73;
    }

    .delay.very-late {
      color: #ff7777;
    }

    .train-location {
      margin-top: 8px;
      color: #9aafb5;
      font-size: 11px;
    }

    .train-location b {
      color: #e6eef0;
    }

    .train-direction {
      margin-top: 4px;
      color: #617780;
      font-size: 10px;
    }

    /* =========================
       MAP
    ========================= */

    #map {
      flex: 1;
      height: 100%;
      background: #081116;
    }

    .leaflet-container {
      background: #081116;
      font-family: inherit;
    }

    .leaflet-control-zoom {
      border: none !important;
      box-shadow: 0 8px 30px rgba(0,0,0,.35) !important;
    }

    .leaflet-control-zoom a {
      background: rgba(9,20,25,.9) !important;
      color: #d8e7eb !important;
      border: 1px solid rgba(255,255,255,.08) !important;
    }

    /* =========================
       STATION
    ========================= */

    .station-marker {
      position: relative;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #dce9ec;
      border: 3px solid #14262c;
      box-shadow:
        0 0 0 1px rgba(220,233,236,.5),
        0 3px 10px rgba(0,0,0,.45);
    }

    .station-marker.major {
      width: 17px;
      height: 17px;
      border-width: 4px;
    }

    .station-label {
      position: absolute;
      left: 50%;
      top: 20px;
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(5,14,18,.88);
      border: 1px solid rgba(255,255,255,.07);
      color: #d6e3e6;
      font-size: 10px;
      font-weight: 650;
      box-shadow: 0 4px 15px rgba(0,0,0,.25);
      pointer-events: none;
    }

    /* =========================
       TRAIN MARKER
    ========================= */

    .train-marker {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef5f7;
      color: #081116;
      border: 3px solid #172b31;
      box-shadow:
        0 4px 16px rgba(0,0,0,.5),
        0 0 0 1px rgba(255,255,255,.25);
      font-size: 11px;
      font-weight: 950;
      transform: rotate(0deg);
    }

    .train-marker.late {
      background: #ffd49a;
    }

    .train-marker.very-late {
      background: #ff9c9c;
    }

    .train-marker span {
      transform: scale(.92);
    }

    /* =========================
       RIGHT INFO PANEL
    ========================= */

    #infoPanel {
      position: absolute;
      right: 20px;
      top: 20px;
      width: 330px;
      max-height: calc(100% - 40px);
      overflow-y: auto;
      z-index: 900;
      display: none;
      background: rgba(7,17,22,.94);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    #infoPanel.show {
      display: block;
    }

    #infoPanel::-webkit-scrollbar {
      width: 4px;
    }

    #infoPanel::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.12);
    }

    .panel-header {
      padding: 18px 18px 15px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      position: relative;
    }

    .close-panel {
      position: absolute;
      right: 13px;
      top: 13px;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,.06);
      color: #8da1a7;
      cursor: pointer;
      font-size: 15px;
    }

    .panel-kicker {
      font-size: 9px;
      color: #6e858d;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .panel-title {
      margin-top: 5px;
      font-size: 27px;
      font-weight: 950;
      letter-spacing: .2px;
    }

    .panel-subtitle {
      margin-top: 4px;
      color: #91a6ad;
      font-size: 11px;
    }

    .panel-grid {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .info-box {
      padding: 12px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.055);
      border-radius: 11px;
    }

    .info-label {
      font-size: 9px;
      color: #617981;
      margin-bottom: 6px;
    }

    .info-value {
      color: #e4edef;
      font-size: 12px;
      font-weight: 750;
      line-height: 1.35;
    }

    .info-value.big {
      font-size: 18px;
    }

    .info-value.green {
      color: #78e49d;
    }

    .info-value.orange {
      color: #ffc176;
    }

    .info-value.red {
      color: #ff8888;
    }

    .panel-section {
      padding: 0 14px 14px;
    }

    .panel-section-title {
      padding: 5px 4px 9px;
      font-size: 10px;
      color: #849aa1;
      letter-spacing: 1px;
    }

    .next-station {
      padding: 14px;
      border-radius: 12px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.055);
    }

    .next-station-name {
      font-size: 17px;
      font-weight: 850;
    }

    .next-station-meta {
      margin-top: 5px;
      font-size: 10px;
      color: #70868d;
    }

    /* =========================
       ALERT
    ========================= */

    #alertBar {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 20px;
      z-index: 850;
      display: none;
      max-width: 560px;
      padding: 13px 16px;
      border-radius: 13px;
      background: rgba(65,24,24,.94);
      border: 1px solid rgba(255,115,115,.2);
      box-shadow: 0 12px 35px rgba(0,0,0,.3);
    }

    #alertBar.show {
      display: block;
    }

    .alert-title {
      font-size: 11px;
      font-weight: 850;
      color: #ffaaaa;
    }

    .alert-description {
      margin-top: 4px;
      font-size: 10px;
      color: #c99393;
      line-height: 1.5;
    }

    /* =========================
       MOBILE
    ========================= */

    #mobileButton {
      display: none;
      position: absolute;
      left: 14px;
      top: 14px;
      z-index: 1200;
      width: 43px;
      height: 43px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      background: rgba(7,17,22,.9);
      color: white;
      font-size: 18px;
    }

    @media (max-width: 850px) {
      #sidebar {
        position: absolute;
        left: 0;
        top: 0;
        transform: translateX(-100%);
        transition: transform .25s ease;
        width: min(355px, 88vw);
        box-shadow: 20px 0 60px rgba(0,0,0,.5);
      }

      #sidebar.open {
        transform: translateX(0);
      }

      #mobileButton {
        display: block;
      }

      #infoPanel {
        left: 14px;
        right: 14px;
        top: auto;
        bottom: 14px;
        width: auto;
        max-height: 58%;
      }

      #alertBar {
        left: 14px;
        right: 14px;
        bottom: 14px;
      }

      #infoPanel.show + #alertBar {
        display: none;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <button id="mobileButton">☰</button>

  <!-- SIDEBAR -->
  <aside id="sidebar">

    <div class="brand">
      <div class="brand-logo">🚆</div>

      <div>
        <div class="brand-title">TRA LIVE</div>
        <div class="brand-subtitle">TAIWAN RAILWAY REAL-TIME</div>
      </div>

      <div class="live-status">
        <span class="live-dot"></span>
        LIVE
      </div>
    </div>

    <div class="search-box">
      <div class="search-wrapper">
        <span class="search-icon">⌕</span>
        <input
          id="searchInput"
          type="text"
          placeholder="搜尋車次、車站..."
          autocomplete="off"
        >
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">
        全部
      </button>

      <button class="filter-btn" data-filter="normal">
        正常
      </button>

      <button class="filter-btn" data-filter="delay">
        誤點
      </button>
    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-value" id="trainCount">--</div>
        <div class="stat-label">LIVE TRAINS</div>
      </div>

      <div class="stat">
        <div class="stat-value" id="delayCount">--</div>
        <div class="stat-label">DELAYED</div>
      </div>

      <div class="stat">
        <div class="stat-value" id="stationCount">--</div>
        <div class="stat-label">STATIONS</div>
      </div>

    </div>

    <div class="section-title">
      <strong>即時列車</strong>
      <span id="updateText">等待資料...</span>
    </div>

    <div id="trainList">
      <div
        style="
          padding:30px 15px;
          text-align:center;
          color:#60757d;
          font-size:11px;
        "
      >
        正在載入台鐵即時資料...
      </div>
    </div>

  </aside>

  <!-- MAP -->
  <main id="map"></main>

  <!-- INFO PANEL -->
  <section id="infoPanel">

    <div class="panel-header">

      <button
        class="close-panel"
        id="closePanel"
      >
        ×
      </button>

      <div class="panel-kicker" id="panelKicker">
        TRAIN
      </div>

      <div class="panel-title" id="panelTitle">
        --
      </div>

      <div class="panel-subtitle" id="panelSubtitle">
        --
      </div>

    </div>

    <div class="panel-grid">

      <div class="info-box">
        <div class="info-label">車種</div>
        <div class="info-value" id="infoType">--</div>
      </div>

      <div class="info-box">
        <div class="info-label">誤點</div>
        <div class="info-value big" id="infoDelay">--</div>
      </div>

      <div class="info-box">
        <div class="info-label">目前位置</div>
        <div class="info-value" id="infoCurrent">--</div>
      </div>

      <div class="info-box">
        <div class="info-label">方向</div>
        <div class="info-value" id="infoDirection">--</div>
      </div>

      <div class="info-box">
        <div class="info-label">終點</div>
        <div class="info-value" id="infoDestination">--</div>
      </div>

      <div class="info-box">
        <div class="info-label">月台</div>
        <div class="info-value" id="infoPlatform">--</div>
      </div>

      <div class="info-box">
        <div class="info-label">速度</div>
        <div class="info-value" id="infoSpeed">
          TDX 未提供
        </div>
      </div>

      <div class="info-box">
        <div class="info-label">最後更新</div>
        <div class="info-value" id="infoUpdated">--</div>
      </div>

    </div>

    <div class="panel-section">

      <div class="panel-section-title">
        下一站
      </div>

      <div class="next-station">

        <div
          class="next-station-name"
          id="infoNextStation"
        >
          --
        </div>

        <div
          class="next-station-meta"
          id="infoNextMeta"
        >
          --
        </div>

      </div>

    </div>

  </section>

  <!-- ALERT -->
  <div id="alertBar">

    <div
      class="alert-title"
      id="alertTitle"
    >
      ⚠️ 路線異常
    </div>

    <div
      class="alert-description"
      id="alertDescription"
    >
      --
    </div>

  </div>

</div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script src="/app.js"></script>

</body>
</html>
