<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TRA LIVE｜台鐵即時列車</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #080b10;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    body {
      overflow: hidden;
    }

    .topbar {
      height: 70px;
      background: #0d1118;
      border-bottom: 1px solid #242b37;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #151c27;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 23px;
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
    }

    .brand p {
      margin: 2px 0 0;
      color: #7d8796;
      font-size: 12px;
    }

    .live {
      padding: 8px 13px;
      border-radius: 20px;

      color: #67e59a;
      background: #101a15;
      border: 1px solid #21402f;

      font-size: 12px;
      font-weight: 800;
    }

    .layout {
      height: calc(100vh - 70px);
      display: flex;
    }

    .sidebar {
      width: 330px;
      min-width: 330px;

      padding: 14px;

      overflow-y: auto;

      background: #0b0f15;
      border-right: 1px solid #242b37;
    }

    .panel {
      background: #10151d;
      border: 1px solid #222a36;
      border-radius: 12px;

      padding: 14px;
      margin-bottom: 13px;
    }

    .title {
      font-size: 14px;
      font-weight: 800;

      padding-bottom: 10px;
      margin-bottom: 5px;

      border-bottom: 1px solid #222a36;
    }

    .row {
      display: flex;
      justify-content: space-between;

      padding: 9px 0;

      color: #8791a1;
      font-size: 13px;
    }

    .row strong {
      color: #fff;
    }

    .search {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .search input {
      flex: 1;

      min-width: 0;

      padding: 10px;

      border-radius: 8px;
      border: 1px solid #2b3442;

      background: #090d13;
      color: white;

      outline: none;
    }

    .search button {
      border: 0;
      border-radius: 8px;

      padding: 0 13px;

      background: #347cff;
      color: white;

      font-weight: 700;
    }

    .result {
      margin-top: 10px;
    }

    .train-card {
      padding: 11px;

      border-radius: 9px;
      border: 1px solid #252e3b;

      background: #0b1017;

      margin-top: 8px;
      cursor: pointer;
    }

    .train-card:hover {
      border-color: #347cff;
    }

    .train-number {
      font-size: 18px;
      font-weight: 900;
    }

    .train-type {
      margin-top: 3px;
      color: #8a95a6;
      font-size: 12px;
    }

    .delay {
      margin-top: 7px;
      font-size: 12px;
      font-weight: 800;
    }

    .green {
      color: #67e59a;
    }

    .red {
      color: #ff7474;
    }

    .alert {
      margin-top: 8px;

      padding: 11px;

      border-radius: 9px;

      background: #1a1113;
      border: 1px solid #492327;
    }

    .alert-title {
      color: #ff7777;
      font-weight: 800;
      font-size: 13px;
    }

    .alert-text {
      margin-top: 6px;

      color: #bda7aa;
      font-size: 12px;
      line-height: 1.6;
    }

    .muted {
      color: #727d8d;
      font-size: 12px;
    }

    .map {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-label {
      position: absolute;

      z-index: 1000;

      right: 15px;
      top: 15px;

      padding: 10px 13px;

      border-radius: 10px;

      background: rgba(10, 14, 20, .94);
      border: 1px solid #293241;

      font-size: 12px;
    }

    .train-marker {
      width: 28px;
      height: 28px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #347cff;

      border: 2px solid white;

      box-shadow:
        0 0 0 3px rgba(52,124,255,.25),
        0 4px 12px rgba(0,0,0,.45);
    }

    @media(max-width:800px) {

      .sidebar {
        position: absolute;

        z-index: 2000;

        top: 80px;
        left: 10px;

        width: 285px;
        min-width: 0;

        max-height: 55vh;

        background: rgba(11,15,21,.95);

        border: 1px solid #293241;
        border-radius: 12px;
      }

      .brand p {
        display: none;
      }
    }
  </style>
</head>

<body>

<header class="topbar">

  <div class="brand">

    <div class="icon">
      🚆
    </div>

    <div>
      <h1>TRA LIVE</h1>
      <p>臺灣鐵路即時列車資訊</p>
    </div>

  </div>

  <div class="live">
    ● LIVE
  </div>

</header>


<div class="layout">

  <aside class="sidebar">

    <div class="panel">

      <div class="title">
        系統狀態
      </div>

      <div class="row">
        <span>TDX API</span>
        <strong id="apiStatus">連線中</strong>
      </div>

      <div class="row">
        <span>即時列車</span>
        <strong id="trainCount">--</strong>
      </div>

      <div class="row">
        <span>異常事件</span>
        <strong id="alertCount">--</strong>
      </div>

      <div class="row">
        <span>最後更新</span>
        <strong id="lastUpdate">--</strong>
      </div>

    </div>


    <div class="panel">

      <div class="title">
        搜尋車次
      </div>

      <div class="search">

        <input
          id="trainSearch"
          placeholder="例如 1287"
        >

        <button onclick="searchTrain()">
          搜尋
        </button>

      </div>

      <div id="searchResult"></div>

    </div>


    <div class="panel">

      <div class="title">
        即時異常
      </div>

      <div id="alerts">
        <div class="muted">
          載入中...
        </div>
      </div>

    </div>


    <div class="panel">

      <div class="title">
        資料來源
      </div>

      <div class="muted">
        TDX 公共運輸資料服務
      </div>

    </div>

  </aside>


  <section class="map">

    <div id="map"></div>

    <div class="map-label">
      🚆 臺鐵即時地圖
    </div>

  </section>

</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script src="/app.js"></script>

</body>
</html>
